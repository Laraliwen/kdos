<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Liste d'anniversaire Isaac 🎂</title>
  <link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">

  <style>
    body {
      background-image: url('fond_anniversaire.jpg');
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: "Poiret One", sans-serif;
      text-align: center;
      margin: 0;
      padding: 40px;
      color: #fff;
      min-height: 100vh;
    }

    h1, h2 {
      color: #eef4ff;
      text-shadow: 3px 3px 5px rgba(0,0,0,0.5);
    }

    h1 {
      font-weight: 700;
      font-size: 60px;
      margin-bottom: 50px;
      color: rgba(255, 238, 180, 0.877);
    }

    h2 {
      font-weight: 400;
      font-size: 30px;
      margin-bottom: 40px;
    }

    p {
      font-weight: 400;
      font-size: 25px;
      margin-bottom: 40px;
    }

    /* Grille : 2 colonnes */
    ul.grille {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Tuiles cadeaux */
    ul.grille li.tuile {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(200, 210, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(255, 187, 0, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      color: #fff;
      text-align: center;
      line-height: 2;
    }

    ul.grille li.tuile:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(255, 187, 0, 0.4);
    }

    ul.grille li.tuile img {
      width: 45%;
      height: 100%;
      object-fit: cover;
      flex-shrink: 0;
    }

    ul.grille li.tuile p {
      flex: 1;
      margin: 20px;
      font-size: 24px;
      font-weight: 600;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
    }

    .lien-normal {
      color: #fff;
      text-decoration: none;
    }

    .lien-normal:hover {
      text-decoration: underline;
      color: #c6d6ff;
    }

    /* Bouton retour */
    .btn {
  display: inline-block;
  margin: 40px auto;
  background: rgba(255, 225, 143, 0.8);
  padding: 10px 18px;
  border-radius: 8px;
  color: #fff;
  text-decoration: none;
  font-size: 20px;
  transition: 0.3s;
}

    .btn:hover {
      background: rgba(255, 200, 47, 0.8);
    }

    /* Responsive */
    @media (max-width: 900px) {
      ul.grille {
        grid-template-columns: 1fr;
      }
      ul.grille li.tuile {
        flex-direction: column;
      }
      ul.grille li.tuile img {
        width: 100%;
        height: auto;
      }
    }

  </style>
</head>
<body>
  <h1>Bienvenue sur la liste<br>d'anniversaire d'Isaac</h1>

  <div id="content">
    <h2>Clique sur les références des cadeaux pour en savoir plus !</h2>

    <ul class="grille">
      <li class="tuile">
        <img src="robert_junior.jpg" alt="Dictionnaire Robert Junior">
        <p>
          <a href="https://urlr.me/hvQPMa" target="_blank" class="lien-normal">
            Dictionnaire <br> Robert Junior
          </a>
        </p>
      </li>

      <li class="tuile">
        <img src="spiral_designer_.jpg" alt="Spiral Designer">
        <p>
          <a href="https://urlr.me/XTc4KN" target="_blank" class="lien-normal">
            Ravensburger <br> Spiral Designer
          </a>
        </p>
      </li>

      <li class="tuile">
        <img src="magazine.jpg" alt="Magazine">
        <p>
          <a href="https://urlr.me/UbVsau" target="_blank" class="lien-normal">
            Abonnement à <br> Science & Vie Découvertes
          </a>
        </p>
      </li>

      <li class="tuile">
        <img src="lego_sw.jpg" alt="Lego Star Wars">
        <p>Lego Star Wars AT-AT™ Walker pain d’épices</p>
      </li>
    </ul>
  </div>

  <a href="index.html" class="btn">⬅ Retour à l'accueil</a>

</body>
</html>
